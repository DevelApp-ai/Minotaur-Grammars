name: Grammar Validation

# Validates grammar changes in this repository by running the
# ENFAStepLexer-StepParser test suite against this checkout. Its tests,
# benchmarks, and demo load all grammars from here (test-grammars/), so a
# grammar change that breaks loading or parsing fails CI.
#
# In addition, every grammar file (not just test-grammars/) is parse-validated
# through StepLexer/StepParser by GrammarRepositoryParseTests in the ENFA
# suite (see issue #18): on pull requests only the changed .grammar files are
# validated (fast path), while pushes to main verify ALL grammars against the
# recorded baseline (.grammar-parse-baseline.txt). The baseline can be
# regenerated with a workflow_dispatch run in 'record' mode.
#
# This is the primary grammar-correctness gate (see issue #7); OPA policies
# (issue #5) only cover license/metadata concerns once those exist.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Grammar parse-validation mode'
        type: choice
        options: [verify, record]
        default: verify

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  validate-grammars:
    name: ENFAStepLexer-StepParser integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Minotaur-Grammars (this repository)
        uses: actions/checkout@v4
        with:
          # Full history on PRs so changed-file detection can diff against
          # the base commit.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Checkout ENFAStepLexer-StepParser
        uses: actions/checkout@v4
        with:
          repository: DevelApp-ai/ENFAStepLexer-StepParser
          path: enfa
          # Validate against the consumer's main branch so grammar changes
          # are proven compatible with what consumers actually use.
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Determines which grammars the parse-validation harness (see issue
      # #18) should validate:
      #  - pull_request: only the .grammar files changed in the PR; skip
      #    entirely (mode=none) when no grammar file changed.
      #  - push to main: verify all grammars against the baseline.
      #  - workflow_dispatch: the selected mode (verify or record).
      - name: Determine grammar parse-validation scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Three-dot diff: changes made on the PR branch since it
            # diverged from the base, regardless of how far the base branch
            # has advanced since. A failed diff must fail the job loudly -
            # never silently skip the grammar gate.
            if ! files=$(git diff --name-only --diff-filter=ACMR "${base}...HEAD" -- '*.grammar'); then
              echo "Failed to compute changed grammar files against base ${base}" >&2
              exit 1
            fi
            if [ -n "$files" ]; then
              {
                echo "GRAMMAR_VALIDATION_MODE=changed"
                echo "GRAMMAR_VALIDATION_FILES<<GRAMMAR_FILES_EOF"
                printf '%s\n' "$files"
                echo "GRAMMAR_FILES_EOF"
              } >> "$GITHUB_ENV"
              echo "Parse-validating changed grammars:"
              printf '%s\n' "$files"
            else
              echo "GRAMMAR_VALIDATION_MODE=none" >> "$GITHUB_ENV"
              echo "No grammar files changed - parse validation skipped."
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "GRAMMAR_VALIDATION_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "GRAMMAR_VALIDATION_MODE=verify" >> "$GITHUB_ENV"
          fi

      # Replicates enfa/.github/actions/setup-cognitivegraph-feed (that action
      # resolves paths relative to the ENFA checkout root, which does not hold
      # here because ENFA is checked out under enfa/).
      - name: Provide DevelApp.CognitiveGraph package feed
        run: |
          set -euo pipefail
          CG_VERSION=$(grep -oPm1 '(?<=DevelApp.CognitiveGraph" Version=")[^"]+' \
            enfa/src/DevelApp.StepParser/DevelApp.StepParser.csproj)
          if [ -z "$CG_VERSION" ]; then
            echo "Could not determine DevelApp.CognitiveGraph version" >&2
            exit 1
          fi
          echo "Providing DevelApp.CognitiveGraph ${CG_VERSION} from the CognitiveGraph release"
          mkdir -p "$GITHUB_WORKSPACE/.cgfeed"
          curl -sL --fail --retry 3 \
            -o "$GITHUB_WORKSPACE/.cgfeed/DevelApp.CognitiveGraph.${CG_VERSION}.nupkg" \
            "https://github.com/DevelApp-ai/CognitiveGraph/releases/download/v${CG_VERSION}/DevelApp.CognitiveGraph.${CG_VERSION}.nupkg"
          dotnet nuget add source "$GITHUB_WORKSPACE/.cgfeed" -n cognitivegraph-release

      - name: Run test suite against this repository's grammars
        env:
          MINOTAUR_GRAMMARS_DIR: ${{ github.workspace }}
          GRAMMAR_VALIDATION_BASELINE_OUT: ${{ github.workspace }}/grammar-parse-baseline.new.txt
        run: >
          dotnet test enfa/ENFAStepLexer-StepParser.sln
          --configuration Release
          --logger trx --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grammar-validation-results
          path: TestResults
          if-no-files-found: warn

      # Present only in 'record' runs: the freshly observed baseline for
      # .grammar-parse-baseline.txt, ready to be committed.
      - name: Upload recorded grammar parse baseline
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'record'
        with:
          name: grammar-parse-baseline
          path: grammar-parse-baseline.new.txt
          if-no-files-found: ignore

  # Fail fast on obvious structural problems that the test suite cannot see
  # (e.g. stray files at repo root, empty grammar files).
  sanity-check:
    name: Repository sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Minotaur-Grammars (this repository)
        uses: actions/checkout@v4

      - name: No empty grammar files
        run: |
          set -euo pipefail
          empty=$(find . -name '*.grammar' -type f -empty)
          if [ -n "$empty" ]; then
            echo "Empty grammar files found:" >&2
            echo "$empty" >&2
            exit 1
          fi

      - name: Every grammar file declares a Grammar header
        run: |
          set -euo pipefail
          missing=""
          while IFS= read -r f; do
            if ! grep -qE '^\s*Grammar:\s*\S+' "$f"; then
              missing="$missing$f"$'\n'
            fi
          done < <(find . -name '*.grammar' -type f)
          if [ -n "$missing" ]; then
            echo "Grammar files without a 'Grammar:' header:" >&2
            printf '%s' "$missing" >&2
            exit 1
          fi
